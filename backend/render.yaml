services:
  - type: web
    name: sales-dashboard-api
    env: docker
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sales-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://your-frontend-url.vercel.app"
  - type: psql
    name: sales-db
    region: oregon
    plan: free
    postgresMajorVersion: 15
